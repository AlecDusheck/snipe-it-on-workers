name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm prepare:fixture
      - run: pnpm --filter @simplyalec/laravel-cf-workers-laravel-runtime test:integration
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm test:panel
      - run: pnpm benchmark
      - run: pnpm audit
      - run: pnpm dry-run
